<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACTS Excel</title><style>STYLE_CONTENT</style></head>
<body><main id="app" aria-label="ACTS Excel workbench">
<header><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M4 9h16M10 9v12M4 15h16" stroke="currentColor" stroke-width="1.7"/></svg></div><div class="heading"><span class="brand">ACTS <b>Excel</b></span><span id="title" role="status">Preparing your data</span></div><span id="status" class="badge">Working</span><button id="expand" class="icon" aria-label="Collapse details" aria-expanded="true">⌃</button><button id="fullscreen" class="icon" aria-label="Fullscreen" hidden>⛶</button></header>
<section id="details"><div id="metrics"></div><div id="body"><div class="skeleton"></div><div class="skeleton short"></div></div><div id="notes"></div><footer id="footer"></footer></section>
<div id="message" role="status" aria-live="polite"></div>

</main><script>SCRIPT_CONTENT</script></body></html>
