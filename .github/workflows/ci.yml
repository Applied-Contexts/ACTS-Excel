name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-2025, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-24.04, target: linux-x64-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: linux-arm64-musl, musl: true }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ !matrix.musl }}
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: ${{ !matrix.musl }}
      - run: npm run bundle -- --target ${{ matrix.target }}
        if: ${{ !matrix.musl }}
      - run: npm run check && npm test && npm run test:package
        if: ${{ !matrix.musl }}
      - name: Test musl packages in Alpine
        if: ${{ matrix.musl }}
        env:
          ACTS_TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -e ACTS_TARGET -v "$PWD:/workspace" -w /workspace node:22-alpine sh -ec '
            apk add --no-cache git tar libstdc++
            git config --global --add safe.directory /workspace
            npm ci
            npm run bundle -- --target "$ACTS_TARGET"
            npm run check
            npm test
            npm run test:package
          '
      - name: Test MCP App UI
        if: matrix.target == 'linux-x64'
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-${{ matrix.target }}
          path: release/ACTS-Excel-*-${{ matrix.target }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
