name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm run build
      - run: npm test
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:ui
      - run: npm run bundle
      - name: Smoke test the staged package
        run: node --import tsx --test tests/mcp.test.ts
        env:
          ACTS_TEST_SERVER: .stage/acts-excel/dist/server.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: acts-excel-${{ runner.os }}-${{ runner.arch }}
          path: release/*
          if-no-files-found: error
      - if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: test-results/
